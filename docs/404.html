<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here</title>
<meta name="robots" content="noindex">
<script>
  // The site is the repository's docs/ folder, served at the root. An address that
  // includes "/docs/" is the folder path typed by habit: send it to the same place
  // without it. Anything else gets the links below.
  (function () {
    var path = window.location.pathname
    var fixed = path.replace(/\/docs(\/|$)/, '/')
    if (fixed !== path) window.location.replace(fixed + window.location.search + window.location.hash)
  })()
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1119; color: #e8eef5; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; }
  main { max-width: 52ch; }
  h1 { font-size: 28px; margin: 0 0 10px; }
  p { color: #9db0c3; line-height: 1.55; }
  a { color: #7fe0b3; }
  ul { padding-left: 18px; line-height: 1.9; }
</style>
</head>
<body>
<main>
  <h1>That page is not here</h1>
  <p>The address may have an extra <code>/docs/</code> in it, which the browser is correcting now. If you are still reading this, these are the pages that exist:</p>
  <ul>
    <li><a href="/Supply-chain/">The site</a></li>
    <li><a href="/Supply-chain/app/">The tool, as a demo</a></li>
    <li><a href="/Supply-chain/board/">The build board</a></li>
    <li><a href="https://github.com/ulrichmonthe/Supply-chain">Source and documentation</a></li>
  </ul>
</main>
</body>
</html>
