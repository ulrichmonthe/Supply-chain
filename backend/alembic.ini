# Alembic configuration. The app runs migrations itself at startup (see
# app/migrate.py); this file exists so the `alembic` CLI works from backend/ for
# authoring new revisions:
#
#     cd backend && ../.venv/bin/alembic revision --autogenerate -m "what changed"
#
# The database URL is not set here on purpose: env.py reads it from the app's
# settings, so the CLI and the app can never disagree about which database.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
